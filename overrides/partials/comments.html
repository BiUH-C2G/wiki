{% if page.meta.comments is not sameas false %}
  <h2 id="__comments">评论</h2>
  <script
    src="https://giscus.app/client.js"
    data-repo="BiUH-C2G/wiki"
    data-repo-id="R_kgDOQ-ztSg"
    data-category="公告"
    data-category-id="DIC_kwDOQ-ztSs4C1en4"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="light"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async
  ></script>

  <script>
    var giscus = document.querySelector("script[src*=giscus]")

    // Match the initial Giscus theme to the site's active palette.
    var palette = __md_get("__palette")
    if (palette && typeof palette.color === "object") {
      var theme = palette.color.scheme === "slate"
        ? "transparent_dark"
        : "light"
      giscus.setAttribute("data-theme", theme)
    }

    // Keep Giscus in sync when the visitor switches palettes.
    document.addEventListener("DOMContentLoaded", function() {
      var ref = document.querySelector("[data-md-component=palette]")
      if (!ref) return

      ref.addEventListener("change", function() {
        var palette = __md_get("__palette")
        if (!palette || typeof palette.color !== "object") return

        var theme = palette.color.scheme === "slate"
          ? "transparent_dark"
          : "light"
        var frame = document.querySelector(".giscus-frame")
        if (!frame) return

        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: theme } } },
          "https://giscus.app"
        )
      })
    })
  </script>
{% endif %}
